[package]
name = "krazydev-server"
version = "0.1.0"
edition = "2021"
description = "KrazyDev portfolio server — Rust/Axum avec protections anti-abus (rate-limit, headers, anti-DDoS applicatif)"
authors = ["KrazyMan_off aka Sasha <krazy@krazydev.dev>"]

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "compression-gzip"] }
tower_governor = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
