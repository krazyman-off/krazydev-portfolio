plugins:
  - id: km-riotops
    nom: KM-RiotOps
    tagline: "Minecraft Security & Resilience Engine"
    statut: dev
    version: 2.0.0-DEV
    derniere-maj: 2026-09-15
    gratuit: true
    nouveau: true
    java: true
    rust: false
    maintenu: true
    note: "Nouveau. Moteur de securite & resilience : decouvre les faiblesses avant un attaquant. Builds : Paper 1.20.4 (2.0.0-DEV) + sonde Velocity (0.1.0-DEV)."
    features:
      - "Security engine integre : un seul plugin, pas juste un anti-crash"
      - "Raisonnement en graphe : command -> permission -> etat -> amplification"
      - "Agents specialises en parallele (command, permission, plugin, config, protocol, resource)"
      - "Stress-test + fuzzing controles, budgets CPU/RAM, arret d'urgence"
      - "Rapports console / JSON / HTML + commande /km-riotops doctor"
      - "Safety first : aucun scan externe, aucune cible arbitraire, aucune persistance"
      - "Backend Paper 2.0.0-DEV + sonde télémétrie Velocity 0.1.0-DEV"

