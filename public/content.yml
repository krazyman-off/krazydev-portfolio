# ================= 10 : KrazyMan Performance =================
krazy-perf:
  name: KrazyMan Performance
  icon: emojis/krazy-perf.png
  badges:
    - text:
        fr: "STABLE 1.0.0"
        en: "STABLE 1.0.0"
    - text:
        fr: "STRESS-TEST ✓"
        en: "STRESS-TEST ✓"
  meta:
    fr: "Optimisation & isolation de lag"
    en: "Lag optimisation & isolation"
  desc:
    fr: "Isole ce qui fait lag ta machine avant que ce soit toi qui lag : redstone clocks, hoppers, AI, chunks — avec watchdog et métriques. **Testé en conditions réelles**."
    en: "Isolates what makes your machine lag before it is you lagging: redstone clocks, hoppers, AI, chunks — with watchdog and metrics. **Tested in real conditions**."
  features:
    fr:
      - "▸ Isolation lag : chunks, redstone, AI, hoppers"
      - "▸ Watchdog froid + redstone clock detector"
      - "▸ Optimisation entité-AI + pregen de chunks"
      - "▸ Prometheus exporter + dashboard santé serveur"
    en:
      - "▸ Lag isolation: chunks, redstone, AI, hoppers"
      - "▸ Cold watchdog + redstone clock detector"
      - "▸ Entity-AI optimisation + chunk pregen"
      - "▸ Prometheus exporter + server health dashboard"
  stats:
    - value: "-X ms"
      label:
        fr: "MSPT après fix"
        en: "MSPT after fix"
    - value: "Watchdog"
      label:
        fr: "lag détecté"
        en: "lag detected"
    - value: "Prom"
      label:
        fr: "métriques live"
        en: "live metrics"
  update:
    fr: "MAJ 2026-09-11"
    en: "UPD 2026-09-11"

