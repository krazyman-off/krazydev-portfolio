# =====================================================================
#  KrazyDev — CONTENU : tous les textes (français / anglais) des plugins
# =====================================================================
#  Indexé par "id", le même que dans organization.yml / attribut.yml /
#  color.yml. Les textes des badges (les COULEURS sont dans color.yml)
#  sont listés ici dans l'ordre, appariés un à un avec color.yml.
#  Markdown autorisé dans meta / desc / features : **gras** et *italique*.
#
#  Pour AJOUTER un plugin : 1) copie un bloc dans content.yml,
#  2) donne-lui un numéro dans organization.yml, 3) remplis ses
#  conditions dans attribut.yml, 4) son look dans color.yml.

chips:
  java:
    icon_ok: emojis/approved.png
    icon_no: emojis/not-approved.png
    label:
      fr: "Java"
      en: "Java"
    title:
      fr: "Version Java disponible"
      en: "Java version available"
  rust:
    icon_ok: emojis/approved.png
    icon_no: emojis/not-approved.png
    label:
      fr: "Rust"
      en: "Rust"
    title:
      fr: "Pas encore de version Rust"
      en: "No Rust version yet"
  maintenu:
    icon_ok: emojis/approved.png
    icon_no: emojis/not-approved.png
    label:
      fr: "Maintenu"
      en: "Maintained"
    title:
      fr: "Plugin maintenu"
      en: "Maintained plugin"

# ================= 1 : KM-AC =================
km-ac:
  name: KM-AC
  icon: emojis/km-ac.png
  badges:
    - text:
        fr: "DEV 1.0.0"
        en: "DEV 1.0.0"
    - text:
        fr: "STRESS-TEST ✓"
        en: "STRESS-TEST ✓"
  meta:
    fr: "Anti-Cheat réseau — 138 checks"
    en: "Network anti-cheat — 138 checks"
  desc:
    fr: "Le shield qui rend la triche **épuisante**. Détecte et isole les comportements impossibles sans casser l'expérience des légitimes."
    en: "The shield that makes cheating **exhausting**. Detects and isolates impossible behaviour without breaking the experience of legit players."
  features:
    fr:
      - "▸ 138 checks : mouvement, combat, impossibles"
      - "▸ Proxy-first : lecture AVANT le backend"
      - "▸ Adaptateur Paper/Folia, coeur commun"
    en:
      - "▸ 138 checks: movement, combat, impossible"
      - "▸ Proxy-first: reads BEFORE the backend"
      - "▸ Paper/Folia adapter, shared core"
  stats:
    - value: "138"
      label:
        fr: "checks actifs"
        en: "active checks"
    - value: "<0,05ms"
      label:
        fr: "latence ajoutée"
        en: "added latency"
    - value: "99,9%"
      label:
        fr: "légitimes intacts"
        en: "legits intact"
  update:
    fr: "MAJ 2026-09-11"
    en: "UPD 2026-09-11"

# ================= 2 : KM-RiotOps =================
km-riotops:
  name: KM-RiotOps
  icon: emojis/km-riotops.png
  badges:
    - text:
        fr: "NOUVEAU — DEV 2.0.0"
        en: "NEW — DEV 2.0.0"
  meta:
    fr: "Minecraft Security & Resilience Engine"
    en: "Minecraft Security & Resilience Engine"
  desc:
    fr: "Un moteur de **sécurité offensive & résilience** intégré au serveur : il découvre les faiblesses AVANT qu'un attaquant les trouve. Il teste ton serveur contre lui-même, en procédant par graphe de risques, agents spécialisés et corrélation de chaînes d'impact."
    en: "An offensive **security & resilience** engine built into the server: it finds weaknesses BEFORE an attacker does. It tests your server against itself, walking through a risk graph, specialised agents and impact-chain correlation."
  features:
    fr:
      - "▸ Flux complet : discovery → baseline → agents → corrélation → rapport"
      - "▸ Agents parallèles : command, permission, plugin, config, protocol, resource"
      - "▸ Stress-test, fuzzing contrôlé, analyse de chaînes de vulnérabilité"
      - "▸ Safety Controller : budgets CPU/RAM, stop d'urgence, aucun scan réseau externe"
      - "▸ Rapports console / JSON / HTML + commande doctor"
      - "▸ Builds : Paper 1.20.4 (2.0.0-DEV) + sonde Velocity (0.1.0-DEV)"
    en:
      - "▸ Full pipeline: discovery → baseline → agents → correlation → report"
      - "▸ Parallel agents: command, permission, plugin, config, protocol, resource"
      - "▸ Stress-test, controlled fuzzing, vulnerability-chain analysis"
      - "▸ Safety Controller: CPU/RAM budgets, emergency stop, zero external network scan"
      - "▸ Console / JSON / HTML reports + doctor command"
      - "▸ Builds: Paper 1.20.4 (2.0.0-DEV) + Velocity probe (0.1.0-DEV)"
  stats:
    - value: "Graph"
      label:
        fr: "risque en chaîne"
        en: "chained risk"
    - value: "32"
      label:
        fr: "agents max"
        en: "max agents"
    - value: "0"
      label:
        fr: "scan externe"
        en: "external scan"
  update:
    fr: "NOUVEAU — MAJ 2026-09-15"
    en: "NEW — UPD 2026-09-15"

# ================= 3 : KM-AntiBots =================
km-antibots:
  name: KM-AntiBots
  icon: emojis/km-antibots.png
  badges:
    - text:
        fr: "DEV 1.0.0"
        en: "DEV 1.0.0"
    - text:
        fr: "STRESS-TEST ✓"
        en: "STRESS-TEST ✓"
  meta:
    fr: "Anti-bot / anti-raid — l'edge qui remplace Cloudflare"
    en: "Anti-bot / anti-raid — the edge that replaces Cloudflare"
  desc:
    fr: "Cloudflare exige un domaine et ne voit pas Minecraft. KM-AntiBots inspecte le protocole natif (handshake, ping→join) et protège ton IP brute, sans DNS."
    en: "Cloudflare needs a domain and cannot see Minecraft. KM-AntiBots inspects the native protocol (handshake, ping→join) and protects your raw IP, no DNS needed."
  features:
    fr:
      - "▸ HandshakeValidator protocole Minecraft natif"
      - "▸ BotScorer : score humain→bot (VPN/hosting)"
      - "▸ Challenge 5s + passage 30min, anti faux-positif"
      - "▸ Whitelist/blacklist persistantes, bridge Bukkit"
    en:
      - "▸ HandshakeValidator native Minecraft protocol"
      - "▸ BotScorer: human→bot score (VPN/hosting)"
      - "▸ 5s challenge + 30min pass, anti false-positive"
      - "▸ Persistent whitelist/blacklist, Bukkit bridge"
  stats:
    - value: "99"
      label:
        fr: "score bot max"
        en: "max bot score"
    - value: "<1ms"
      label:
        fr: "overhead handshake"
        en: "handshake overhead"
    - value: "0"
      label:
        fr: "faux positif"
        en: "false positive"
  update:
    fr: "MAJ 2026-09-11"
    en: "UPD 2026-09-11"

