# =====================================================================
#  KrazyDev — Configuration des plugins Minecraft (page /projets)
# =====================================================================
#  L'ORDRE des cartes est contrôlé par le champ "order" :
#    1 = 1ere ligne à gauche    2 = 1ere ligne à droite
#    3 = 2eme ligne à gauche    4 = 2eme ligne à droite ... etc
#  (change juste "order" pour réorganiser, ou ajoute un nouveau bloc)
#
#  Pour AJOUTER un plugin : copie/colle un bloc "plugins:" existant et
#  remplace id, order, name, icon, badges, meta, desc, features, stats,
#  chips, update, dl.
#
#  Champs disponibles :
#    - id          : identifiant unique (slug), pas d'espace, ex: km-ac
#    - order       : position dans la grille (nombre)
#    - name        : nom EXACT affiché (doit matcher une clé de js/dl.js
#                    pour que le bouton ⬇ Download fonctionne)
#    - icon        : chemin vers l'image (emojis/*.png)
#    - card_style  : (optionnel) style CSS ajouté à la carte
#    - badges      : liste de badges. Chaque badge a "text" (fr/en),
#                    "tone" (dev|stable|public|maintenu|stress) et un
#                    champ optionnel "style" pour forcer les couleurs
#    - meta        : sous-titre (fr/en)
#    - desc        : description (fr/en) — markdown autorisé :
#                    **gras** et *italique*
#    - features    : liste de points (fr: [...] / en: [...])
#    - stats       : les 3 mini-statistiques (value + label fr/en)
#    - chips       : les conditions (icône + label + ok) — Java/Rust/...
#    - update      : texte de mise à jour (fr/en)
#    - dl          : true  -> bouton Download actif (défaut)
#                    false -> bouton grisé "Bientôt disponible"
# =====================================================================

grid:
  columns: 2

plugins:

  # ---------------- 1 : KM-AC ----------------
  - id: km-ac
