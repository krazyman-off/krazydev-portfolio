      fr:
        - "▸ 138 checks : mouvement, combat, impossibles"
        - "▸ Proxy-first : lecture AVANT le backend"
        - "▸ Adaptateur Paper/Folia, coeur commun"
      en:
        - "▸ 138 checks: movement, combat, impossible"
        - "▸ Proxy-first: reads BEFORE the backend"
        - "▸ Paper/Folia adapter, shared core"
    stats:
      - value: "138"
        label:
          fr: "checks actifs"
          en: "active checks"
      - value: "<0,05ms"
        label:
          fr: "latence ajoutée"
          en: "added latency"
      - value: "99,9%"
        label:
          fr: "légitimes intacts"
          en: "legits intact"
    chips:
      - icon: emojis/approved.png
        ok: true
        label:
          fr: "Java"
          en: "Java"
        title:
          fr: "Version Java disponible"
          en: "Java version available"
      - icon: emojis/not-approved.png
        ok: false
        label:
          fr: "Rust"
          en: "Rust"
        title:
          fr: "Pas encore de version Rust"
          en: "No Rust version yet"
      - icon: emojis/approved.png
        ok: true
